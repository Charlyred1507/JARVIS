name: Android Camera APK

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: android-camera-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        working-directory: samples/CameraAccessAndroid

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Create configuration
        run: |
          cat > app/src/main/java/com/meta/wearable/dat/externalsampleapps/cameraaccess/Secrets.kt <<'EOF'
          package com.meta.wearable.dat.externalsampleapps.cameraaccess

          object Secrets {
              const val geminiAPIKey = ""
              const val openClawHost = ""
              const val openClawPort = 18789
              const val openClawHookToken = ""
              const val openClawGatewayToken = ""
              const val webrtcSignalingURL = ""
          }
          EOF

      - name: Build debug APK
        env:
          GITHUB_TOKEN: ${{ secrets.META_PACKAGES_TOKEN || github.token }}
        run: bash ./gradlew --no-daemon --console=plain :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VisionClaw-camera-debug
          path: samples/CameraAccessAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
